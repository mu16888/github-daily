# 赛道 A 标题框架 v2（github-daily 实际生效配置）
# 2026-11-14 锋哥定：标题必须给判断，不许再是「项目名 + 安装/上手 + Star 数」的说明书体。
# 规则说明见：E:/workbuddy工作台/媒体运营/自媒体产出/全平台标题框架_v2_2026-11-14.md
#
# 红线：占位符只能取 FactPack 真实字段（README 原文 + GitHub REST API），
#       不新增体验、效果数字、第一人称经历；句式是判断框架，不是新事实。
#       模板里取不到真实字段时，选标题逻辑会自动跳过，绝不硬凑。
#
# 可用占位符：
#   {name} {repo} {language} {license} {stars} {topics} {created} {pushed}
#  「{selling_point}」（运行时从 README 抽出的可核查事实短语）
#   {problem}（README 的 Why/Problem 原文摘录，可能为空）

meta:
  version: 2
  date: '2026-11-14'
  principle: '标题给判断，不给名词；判断必须挂靠边界/代价/对比/变动/决策之一'

# 标题护栏：候选标题命中任一词即跳过该模板。
# 说明书体 = 只描述「这是什么/怎么装」；虚荣数字 = 拿收藏量当卖点；
# 空判断 = 看似提问但没给任何判断。
banned:
  - '安装教程'
  - '安装步骤'
  - '功能说明'
  - '功能与安装'
  - '怎么装'
  - '怎么用'
  - '上手'
  - '附完整安装命令'
  - '附现成安装步骤'
  - '附安装步骤'
  - '从安装到第一步'
  - '说明里写了这些'
  - '解决什么问题'
  - '一次讲清'
  - '详解'
  - '能带走的上手清单'
  - '使用说明'
  - '使用笔记'
  - '怎么用：'
  - '人收藏'
  - '人已收藏'
  - ' Star'
  - '凭什么火'
  - '凭啥'
  - '到底好在哪'
  - '神器'
  - '必看'
  - '全网最全'
  - '一文搞懂'
  - '5 分钟搞定'
  - '别错过'
  - '建议收藏'
  - '值不值得花时间看'
  - '先看它管什么'
  - '能不能用上，先看这一点'
  - '先看能查到的事实'

# 全部模板都被护栏拦下时的短判断兜底（不含占位符，长度最短，保证不被硬截）。
fallbacks:
  - '工具越装越多，判断没跟着涨'
  - '先定边界，再谈要不要用'
  - '能退回来，比能跑起来更重要'

platforms:

  zhihu:
    task: '抛一个站得住的工程判断，项目名退到次要位置'
    titles:
      - '什么时候不用 {name}：先看「{selling_point}」的前提'
      - '「{selling_point}」有前提，{name} 的适用边界先看清'
      - '{name} 最近更新停在 {pushed}，「{selling_point}」还成立吗'
      - '该不该把 {name} 放进主力链路：「{selling_point}」只是起点'
      - '「{selling_point}」之外，{name} 真正要回答的是边界'
      - '{name} 用 {language} 写这件事，决定不了它该不该上'
      - '别把「{selling_point}」当成结论：{name} 的代价另算'
      - '{name} 的 {license} 协议，比「{selling_point}」更该先看'
      - '一个工程判断，比多装一个 {name} 更值钱'
      - '「{selling_point}」能落地的前提，{name} 说明里写清了吗'

  juejin:
    task: '给可复用的决策条件，重点写「什么时候别用」'
    titles:
      - '什么时候不该上 {name}：「{selling_point}」的前提先过一遍'
      - '「{selling_point}」落地要过的几关，{name} 说明里能对上几条'
      - '{name} 的「{selling_point}」：能跑起来不等于能退回来'
      - '引入 {name} 之前，先算「{selling_point}」的维护成本'
      - '「{selling_point}」不是免费午餐：{name} 的依赖项先看'
      - '{name} 更新到 {pushed}，旧的接入结论要重算'
      - '「{selling_point}」适合什么规模，{name} 说明里有边界吗'
      - '把 {name} 换掉的成本，比装它的成本高多少'
      - '{language} 项目接 {name}：先定回滚，再谈「{selling_point}」'
      - '{name} 的 {license} 与依赖，决定它能不能进生产'

  csdn:
    # CSDN 靠搜索分发，关键词必须前置；但落点从「教程」换成「边界/判断」。
    task: '关键词前置保搜索，落点换成判断 / 边界 / 避坑'
    titles:
      - '{name} 适用边界：什么场景能用，什么场景别碰'
      - '{name} 的「{selling_point}」：前提、代价与回滚'
      - '{name} 什么时候不该用：先看「{selling_point}」的前提'
      - '{name} 接入前要确认的几件事：「{selling_point}」只是其中之一'
      - '{name} 的 {license} 协议与依赖，比「{selling_point}」更该先查'
      - '{name} 从 {created} 到 {pushed}：「{selling_point}」的结论还成立吗'
      - '{name} 避坑：「{selling_point}」有前提，别只看功能'
      - '{name} 的 {language} 实现，决定了哪些场景用不上'
      - '{name} 能不能进生产：先看「{selling_point}」的边界'
      - '{name} 与同类做法的差别，不在「{selling_point}」在边界'

  wechat:
    # 64 UTF-8 字节 ≈ 21 汉字，模板必须短。
    task: '系列化 + 立场句，短到一眼读完'
    titles:
      - '先定边界，再谈 {name}'
      - '{name}：前提比功能重要'
      - '能退回来，才算能用'
      - '「{selling_point}」不是结论'
      - '别急着装，先问代价'
      - '{name} 适合谁，不适合谁'
      - '「{selling_point}」的前提'
      - '工具是手段，判断是本事'

  toutiao:
    # 赛道 A 备用（正常只走赛道 B），≤30 字，不出现英文项目名。
    task: '冲突 + 代价，不出现英文项目名'
    titles:
      - '多装一个工具，未必少一个判断'
      - '能跑起来，不等于能退回来'
      - '先看边界，再看功能'
      - '省下的那一步，代价在哪'
      - '工具越装越多，账越算不清'
      - '先问什么时候别用'
