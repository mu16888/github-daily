# 标题 / 摘要 / 标签的 SEO 配置
#
# 原则：所有钩子（hook）必须由 README 或 API 里真实检测到的信号触发。
# 不写「神器 / 必看 / 全网最全 / 5 分钟搞定」这类无法证实的夸张词。
# 搜索词的落点是：项目名 + 「怎么用 / 安装 / 教程 / 上手」这类真实长尾词。

# 标题框架 v2（2026-11-14）：本通道是本机 legacy 通道（掘金/CSDN）实际发布标题。
# 旧版全是「{name} 解决什么问题？…附安装教程」的说明书体，已废。
# 新版只给判断：边界 / 代价 / 对比 / 变动 / 决策，占位符只用可核查字段。
# 护栏见 src/seo.py::build()（读 config/title_framework.yaml 的 banned）。
# 注意：模板刻意不用 {hook}——hooks 里含「{stars} Star 的开源项目」这类虚荣数字，
#       一旦进标题就会拉低档次。hooks 仍供导语/摘要使用，不进标题。
platforms:
  zhihu:
    title_max: 50        # 第三方资料 30~100 字说法不一，取保守值
    title_style: 判断式 / 边界式
    templates:
      - '{name} 适用边界：什么时候能用，什么时候别碰'
      - '什么时候不用 {name}：先把前提列清楚'
      - '{name} 该不该进主力链路，看能不能退回来'
      - '把 {name} 换掉的成本，比装它更该先算'
      - '{language} 写的 {name}，决定不了它该不该上'
      - '先定边界再谈 {name}，比先记命令有用'
    brief_max: 120
    brief_template: '{name} 解决什么问题？{desc_short} 先看它替你解决什么麻烦，功能、安装命令和上手步骤都讲到了。'

  juejin:
    title_max: 80        # 适配器实测：≤80 字
    title_style: 工程决策 / 可复用判断
    templates:
      - '{name} 什么时候不该用：前提、依赖与回滚'
      - '引入 {name} 之前，先算维护成本'
      - '{name} 能跑起来，不等于能退回来'
      - '{name} 的适用规模，说明里写清了吗'
      - '{language} 项目接 {name}：先定回滚，再谈能力'
      - '{name} 的边界在哪，比它能做什么更该先问'
    brief_max: 100       # 适配器实测：摘要 ≤100 字
    brief_template: '{name} 解决什么问题？{hook}。功能、安装命令和上手步骤都讲到了，照着做就行。'

  csdn:
    title_max: 50        # 第三方资料 50~100 字说法不一，取保守值；SEO 建议 15~25 字
    # CSDN 靠搜索分发 → 项目名关键词仍前置，但落点从「教程」换成「判断/边界」。
    title_style: 关键词前置 + 判断落点
    templates:
      - '{name} 适用边界：什么场景能用，什么场景别碰'
      - '{name} 什么时候不该用：前提先过一遍'
      - '{name} 接入前要确认的几件事'
      - '{name} 能不能进生产：先看清边界'
      - '{name} 避坑：功能之外还有前提'
      - '{name} 与同类做法的差别，在边界不在功能'
    brief_max: 200
    brief_template: '{name} 解决什么问题？{desc_short} 核心功能、安装教程、上手步骤和常见问题一次给齐，命令照仓库说明抄，新手跟着做就行。'

# 真实信号 -> 标题钩子。只有检测到才使用。
hooks:
  one_command: '一行命令就能装好'          # 安装块里只有一行有效命令
  licensed: '{license} 开源协议'            # 有明确 SPDX 许可证
  high_stars: '{stars} Star 的开源项目'      # star >= 1000
  new_project: '近期新项目'                 # 创建 <= 90 天
  fallback: 'README 里有现成安装命令'       # 兜底，也是事实（install_blocks 非空才会入选）
  max_hooks: 1                            # 只取最强的一个钩子：标题短、有力，也避免超长被裁

# 从仓库 topics（真实标签）映射中文搜索词，用于摘要
topic_zh:
  cli: 命令行工具
  python: Python
  javascript: JavaScript
  typescript: TypeScript
  rust: Rust
  go: Go
  markdown: Markdown
  pdf: PDF
  docker: Docker
  ai: AI
  llm: 大模型
  mcp: MCP
  automation: 自动化
  tool: 效率工具
  open-source: 开源

# CSDN 标签：项目名进标签，便于站内搜索命中
csdn_tag_template: '{name},GitHub开源项目,安装教程,{language},新手入门'
csdn_tag_max: 5

# 文末 FAQ：只回答能由真实字段支撑的问题（SEO 长尾词，不编造结论）
faq:
  - q: '{name} 解决什么问题？'
    a: '{name} 在仓库简介里写的是「{desc_lead}」。说明里写了缘由的，开头那段就是作者原话；没写的，就看这句简介和标签，别自己脑补。'
  - q: '{name} 怎么安装？'
    a: '把说明里 Install 那段的命令复制下来跑一遍就行。装不上先看说明是不是改过，再看电脑上装没装它要的环境。'
  - q: '{name} 免费吗？'
    a: '仓库标的是 {license} 协议，代码可以免费用。拿去做生意或者改了再发，先看条款让不让。'
  - q: '{name} 适合新手吗？'
    a: '看两件事就够了。说明里有没有现成安装命令，要不要自己把源码做成软件。星星多不多跟这个没关系。'
