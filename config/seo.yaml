# 标题 / 摘要 / 标签的 SEO 配置
#
# 原则：所有钩子（hook）必须由 README 或 API 里真实检测到的信号触发。
# 不写「神器 / 必看 / 全网最全 / 5 分钟搞定」这类无法证实的夸张词。
# 搜索词的落点是：项目名 + 「怎么用 / 安装 / 教程 / 上手」这类真实长尾词。

platforms:
  zhihu:
    title_max: 50        # 第三方资料 30~100 字说法不一，取保守值
    title_style: 问题式 / 观点式
    templates:
      - '{name} 解决什么问题？{hook}，附安装与上手'
      - '{name} 解决什么问题？{hook}，装之前先看看'
    brief_max: 120
    brief_template: '{name} 解决什么问题？{desc_short} 从它要解决的麻烦说起，功能、安装命令和上手步骤顺着往下看。'

  juejin:
    title_max: 80        # 适配器实测：≤80 字
    title_style: 技术 + 实用性、强调可操作
    templates:
      - '{name} 解决什么问题？{hook}，附完整安装命令'
      - '{name} 解决什么问题？{hook}，功能与用法一次讲清'
    brief_max: 100       # 适配器实测：摘要 ≤100 字
    brief_template: '{name} 解决什么问题？{hook}。功能、安装命令、上手步骤都写在下面，照着做就行。'

  csdn:
    title_max: 50        # 第三方资料 50~100 字说法不一，取保守值；SEO 建议 15~25 字
    title_style: 教程向、关键词前置
    templates:
      - '{name} 解决什么问题？{hook}，功能与安装教程'
      - '{name} 解决什么问题？{hook}，安装详解'
    brief_max: 200
    brief_template: '{name} 解决什么问题？{desc_short} 核心功能、安装教程、上手步骤和常见问题都整理好了，命令照仓库说明抄，新手跟着做就行。'

# 真实信号 -> 标题钩子。只有检测到才使用。
hooks:
  one_command: '一行命令就能装好'          # 安装块里只有一行有效命令
  licensed: '{license} 开源协议'            # 有明确 SPDX 许可证
  high_stars: '{stars} Star 的开源项目'      # star >= 1000
  new_project: '近期新项目'                 # 创建 <= 90 天
  fallback: 'README 里有现成安装命令'       # 兜底，也是事实（install_blocks 非空才会入选）
  max_hooks: 1                            # 只取最强的一个钩子：标题短、有力，也避免超长被裁

# 从仓库 topics（真实标签）映射中文搜索词，用于摘要
topic_zh:
  cli: 命令行工具
  python: Python
  javascript: JavaScript
  typescript: TypeScript
  rust: Rust
  go: Go
  markdown: Markdown
  pdf: PDF
  docker: Docker
  ai: AI
  llm: 大模型
  mcp: MCP
  automation: 自动化
  tool: 效率工具
  open-source: 开源

# CSDN 标签：项目名进标签，便于站内搜索命中
csdn_tag_template: '{name},GitHub开源项目,安装教程,{language},新手入门'
csdn_tag_max: 5

# 文末 FAQ：只回答能由真实字段支撑的问题（SEO 长尾词，不编造结论）
faq:
  - q: '{name} 解决什么问题？'
    a: '{name} 在仓库简介里写的是「{desc_lead}」。说明里写了缘由的，开头那段就是作者原话；没写的，就看这句简介和标签，别自己脑补。'
  - q: '{name} 怎么安装？'
    a: '把说明里 Install 那段的命令复制下来跑一遍就行。装不上先看说明是不是改过，再看电脑上装没装它要的环境。'
  - q: '{name} 免费吗？'
    a: '仓库标的是 {license} 协议，代码可以免费用。拿去做生意或者改了再发，先看条款让不让。'
  - q: '{name} 适合新手吗？'
    a: '看两件事就够了。说明里有没有现成安装命令，要不要自己把源码做成软件。星星多不多跟这个没关系。'
