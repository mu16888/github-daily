# 云端运行档（GitHub Actions）
#
# 用途：赛道 A（AI 科技）上云端自动化 —— 掘金 / CSDN / 知乎。
# 本机（config/settings.yaml）保持 dry_run=true 做演练，两边互不污染。
#
# 用法：python -m src.main --profile cloud --dispatched
# 由 src/main.py 的 load_settings() 深度合并到 settings.yaml 之上。

publish:
  # 云端是真发。本机档案仍是 true，两边不互相改。
  dry_run: false
  enabled: true
  # 2026-11-11 切到新结构稿：判断开场 / 能带走的清单 / 最小一步，
  # 五平台标题与结构各自轮换，不再每天一份「项目说明书」。
  content_source: rewrite

daily:
  # 云端一天 1 篇，三平台各发同一篇（同一稿多投，不是三篇不同稿）
  picks_per_day: 1

quota:
  per_day:
    # 2026-11-10 实测修正：
    #   掘金 1 篇/天，第 2 篇会 err_no:0 却不进文章列表（静默失效）
    juejin: 1
    # CSDN 免费号实测「每天 2 篇」（错误文案：今天发表文章数量已达到限制的2篇）
    csdn: 2
    # 知乎：走浏览器通道。网页端实测是「距上一篇 ≥24h」的滚动限流，
    # 但官方 zhihu-sync 文档写的是每人每天最多 50 次。取更严的那个。
    zhihu: 1
  model: calendar_day

zhihu:
  # 云端走「浏览器通道」。
  # 原因一：官方 OpenAPI 需要 ZHIHU_OPENAPI_APP_SECRET，而知乎后台返回
  #   auth_state=common_user / bind_status=unbind —— 定向开放授权还没到本账号，
  #   拿不到密钥（实测 401 AuthenticationError，签名算法与 body 结构均已核对无误）。
  # 原因二：纯 HTTP 的 web 通道依赖 x-zse-96 签名，实测老接口已 404。
  # 浏览器通道由页面自己算签名，是 2026-11-10 实测发布成功的唯一路径。
  # 等授权下来了把 mode 改成 'openapi' 即可，代码无需改动。
  mode: 'browser'
  # 全自动发布（走浏览器自己算 x-zse-96 签名）
  web_auto_publish: true
  # 知乎官方规范要求「用户确认预览后」才能发 confirmed:true。
  # 这里用仓库所有者的长期授权：改 true 即代表你已确认默认发布参数。
  standing_consent: true
  creation_statement: ''

csdn:
  # 2026-11-12 结论：CSDN 两条自动化通道都被平台侧封死，降级为「本机半自动」（同赛道 B）。
  #   - 浏览器面板：封面控件非确定性灰度（A/B），6 轮重试实测 uploads=[]、控件不渲染，无法绑封面。
  #   - 接口直发 saveArticle：回 code=200 data="成功" 假成功，实测文章不落库（博客列表查无），见 scripts/csdn_api_probe.py。
  # 两者均非代码可修，继续耗即无头苍蝇。故 CSDN 不走任何自动通道，只由流水线产出
  # 「人工发布包」（正文 md + 1200x675 封面 JPG，落 drafts/csdn-manual/<date>/），
  # 锋哥登录 CSDN 网页粘正文、传封面、点发布（2026-11-11 手动发已验证可成）。
  # 2026-11-12 分工：知乎继续云端全自动；掘金改由本机浏览器通道发布。
  mode: 'manual'

platforms:
  juejin:
    # 2026-11-12：content_api/v1/article/publish 被平台侧改坏
    #（空标签报「至少添加一个标签」，非空标签一律「参数错误」），
    # 8 组参数对照均无法通过，代码层无解。掘金改由本机浏览器通道发布，
    # 云端必须停用，否则会与本机双发、触发平台重复内容预警。
    enabled: false
  csdn:
    # 浏览器通道代码已就绪，但**暂不启用**：2026-11-11 本机实测发现，
    # 「新建文章」流程里发布面板的封面区只渲染「暂无内容图片」，
    # 连「从本地上传」按钮和 .el-upload__input 都不挂载（打开已有草稿时两者都在）。
    # 封面是红星必填，传不上就只存草稿 → 若照跑会白耗额度并留下垃圾草稿。
    # 恢复条件：解决「新建 vs 已有草稿」的封面组件渲染差异并本机真发成功一次。
    enabled: false

browser:
  # 云端是 Linux runner，没有 msedge —— channel 留空表示用 Playwright 自带 chromium。
  # profile_dir 是 runner 上的临时目录，每次跑都是干净上下文，靠 ZHIHU_COOKIE 注入登录态。
  channel: ''
  profile_dir: 'state/browser-profile'

schedule:
  # 云端错峰：三个平台之间的间隔要比本机长一点，降低同 IP 密集发文的风控概率
  stagger_min_seconds: 180
  stagger_max_seconds: 600
