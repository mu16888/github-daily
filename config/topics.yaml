# 话题层：把「高赞内容被验证过的结构」变成可复用的切入角度。
#
# 事实来源（发布者 / 统计时间 / 可打开链接）：
#   掘金技术热榜公开接口（匿名只读），抓取时间 2026-11-10 00:25 +08:00
#   https://api.juejin.cn/content_api/v1/content/article_rank?category_id=1&type=hot
#   返回 50 条，逐条互动量见 research/hot_topics_2026-11-10.md。
#
# 口径（必须如实保留）：该榜是「当日新发文章实时热度」，不是全站历史爆款。
#   50 条合计 赞 162 / 藏 151 / 评 61 / 阅 13598，单篇最高 赞 15 / 藏 19；
#   藏 >= 赞 的有 22 条。所以「量大」只按同批相对高位 + 藏赞比理解，
#   不能当绝对爆款量级对外引用。
#
# 红线：本文件只保存「可观察的结构特征」和**我们自己写的**白话句式。
#   不保存原文正文、代码块、例句或观点。reference_titles 只作防洗稿校验基准，
#   生成器绝不读它来造句。文章里的事实一律运行时从 GitHub REST API / README 原文取。

meta:
  captured_at: '2026-11-10 00:25 +08:00'
  publisher: '掘金技术热榜（公开接口，匿名只读）'
  source_url: 'https://api.juejin.cn/content_api/v1/content/article_rank?category_id=1&type=hot'
  sample_size: 50
  calibration_note: 'research/hot_topics_2026-11-10.md；当日新发热度，非历史爆款'

# 防洗稿校验基准：Top 20 公开标题原文，仅用于 8 字连续片段比对，不参与生成。
# 与 research/hot_topics_2026-11-10.md 第 2 节数字一致。
