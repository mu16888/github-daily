# github-daily 运行参数
# 修改本文件即改变流水线行为，无需改代码。

daily:
  picks_per_day: 1          # 每天出几篇（每个平台各发 1 篇，避免刷屏触发风控）
  candidate_pool: 24        # 搜索候选上限（控制 API 请求数）
  # 2026-11-14 话题框架 v3：门槛从「好装」改为「能形成判断」。
  # 权重下调后总分上限下降，9 分会把池子筛空，故降到 6（基础分恰好过线），
  # 由新增的「判断力信号」决定排序，而不是靠硬门槛卡掉项目。
  min_score: 6
  # 旧逻辑在 src/discover.py::pick() 里硬写 `and repo.install_blocks`，
  # 等于「没安装命令就不许入选」——这是每天只推出陌生小工具说明书的机制性根因。
  # false = 取消该硬门槛；true = 恢复旧行为（一键回滚）。
  require_install_blocks: false
  since_days: 45            # 只看近 N 天创建/活跃的项目
  stars_min: 150
  stars_max: 20000
  history_window_days: 120  # 去重台账保留窗口

# GitHub Search API 查询模板；{since} / {recent} 替换成日期
# 注意：GitHub 搜索不支持 >= / <=，必须写 > 和 {min}..{max} 范围。
# 用错语法不会报错，只会静默忽略该条件（实测 >= 写法返回 1587 万条、star 上限完全失效）。
queries:
  - 'created:>{since} stars:{stars_min}..{stars_max} archived:false fork:false'
  - 'pushed:>{recent} stars:{stars_min}..{stars_max} archived:false fork:false language:Python'
  - 'topic:cli stars:{stars_min}..{stars_max} archived:false fork:false pushed:>{since}'

# 打分权重（只依据 README / API 中真实出现的信号，不做推测）
# 2026-11-14 话题框架 v3 改造依据：
#   锋哥判定「这种话题太低级」。根因是权重全给「好装」——
#   Quick Start +3 / 一条命令装 +4 / 免编译 +2 / 低依赖 +1，
#   必然筛出「某人写了个小工具」，有工程深度的项目反被扣分。
#   另外 config/topics.yaml 第 81 行自己写着「50 条掘金热榜里没有一条是
#   项目安装教程 / 功能介绍」，流水线却天天产这个。
# 改造：削「好装」权重，新增 4 个**可核查的文本代理指标**（不是推测，
# 都是 README 里真实出现的词），让有判断空间的项目排到前面。
# 注意：这些只是「值不值得写」的排序信号，真正的话题判断由
# config/topic_framework_v3.yaml 的推导链负责。
score_weights:
  readme_present: 2
  readme_substantial: 2       # README >= 800 字符
  quickstart_section: 1       # 3→1：不再奖励「有安装章节」
  one_command_install: 1      # 4→1：不再奖励「一条命令装完」
  has_license: 1
  has_releases: 2             # 注：score() 当前未读此键，属既有死配置，未改代码
  no_compile_required: 0      # 2→0：免编译不等于有料
  low_dependency: 0           # 1→0：依赖少不等于值得写
  sweet_spot_stars: 1
  # ↓ 判断力信号：README 里明确写了限制 / 对比 / 变更 / 设计取舍，
  #   说明这个话题有边界、有代价、有可讨论的决策，而不只是功能列表。
  has_limitations: 3          # Limitations / Caveats / 已知问题 / 不适用场景
  has_comparison: 3           # benchmark / vs / 对比 / 替代方案 / 性能
  has_change_signal: 3        # breaking change / 迁移 / 弃用 / 版本变动 / changelog
  has_why_section: 2           # Why / 设计取舍 / 原理 / 为什么做
  penalty_tiny_readme: -3     # README < 400 字符
  penalty_wip: -4             # WIP / experimental / not production ready
  penalty_paid_or_key: -2     # 明确要求 API key 或付费套餐

# 每平台每日发文配额（发布前的硬闸门，防止手动多次触发 workflow 重复发文）
# 2026-11-09 核查依据见 DESIGN.md §3。取交集后每天只能 1 篇，别调高。
quota:
  per_day:
    zhihu: 1      # 官方 OpenAPI 上限 50 次/天，但网页端实测为「距上一篇 ≥24h」的滚动限流
    juejin: 1     # 社区实测 1 篇/天，且第 2 篇会返回 err_no:0 却不进文章列表（静默失效）
    csdn: 1       # 官方 2025-11-03 公告下调每日上限；VIP 页 5/15 篇，免费用户社区实测约 1~2 篇
  model: calendar_day   # calendar_day | rolling_24h

# 仿人工发布时间：不要让每天的文章卡在同一分钟发出去。
# GitHub Actions 的 cron 只能写固定时刻，所以 workflow 改成每 15 分钟唤醒一次，
# 由 src/schedule.py 用 HMAC(日期+盐) 确定性算出当天唯一目标时刻，到点才放行。
# 确定性 = 唤醒被延迟/取消时下一棒算出的还是同一时刻，会补发，不会漏发或重发。
schedule:
  enabled: true
  utc_offset_hours: 8       # 北京时间固定 UTC+8，无夏令时，不依赖 tzdata
  window_start: '08:30'     # 可发布窗口（本地时间），目标时刻只落在窗口内
  window_end: '10:45'
  weekend_delay_minutes: 45 # 周六日整体顺延，更像真人作息
  poll_minutes: 15          # 仅 target 模式（daily.yml 手动回退）用；once_daily 不读它
  salt: 'github-daily-human-2026-11'   # 改这个字符串，整套每日时刻序列就换一套
  avoid_round_minutes: true # 避开整点 / 整 5 分 / 整 10 分，秒也避开 0
  stagger_min_seconds: 90   # 三平台之间的错峰下限
  stagger_max_seconds: 420  # 上限；按发布顺序累加，最长约 14 分钟

publish:
  # 总开关。为 false 时只出稿、不调用任何发布接口。
  enabled: true
  # 真发演练止损：掘金 published，CSDN 返回「博主不存在」(http 400) 失败。
  # 待 CSDN 账号/接口问题查清并修复后再改回 false，避免每天定时跑白失败一次。
  # 保持 true 时定时跑只出稿归档，绝不对外发文。
  dry_run: true
  # 出稿用哪套正文：legacy=原「项目说明书」结构（默认，零影响）；
  # rewrite=话题层新结构（判断开场 / 能带走的清单 / 最小一步），见 DESIGN_TOPICS.md。
  # 只有显式改成 rewrite，才会把 src/rewrite.py 的稿子交给发布器。
  # 两个开关互相独立：content_source 决定「发什么」，dry_run 决定「发不发」。
  content_source: legacy
  # 单平台失败不影响其他平台，也不影响出稿归档
  continue_on_error: true

zhihu:
  # 通道选择（A/B/C 三条路都保留，随时可切）：
  #   off     = A：整条知乎跳过，适配器如实 skipped
  #   openapi = C：官方 Publish OpenAPI，需 ZHIHU_APP_KEY/APP_SECRET（「发布者」内测资格）
  #   web     = B：登录态网页会话，需 ZHIHU_COOKIE（不需要内测）
  #   auto    = 有官方凭据且已授权则走 C，否则有 ZHIHU_COOKIE 就走 B，都没有则 A 跳过
  # 2026-11-09 锋哥选 A：先跳过知乎，只跑掘金 + CSDN；跑通后随时可切 web / openapi
  mode: 'off'
  # ↑ 必须加引号：YAML 1.1 会把裸 off / on 解析成布尔 False / True，
  #   旧写法 mode: off 在 yaml.safe_load 后是 False，发布器会静默回退成 auto。
  # B 通道是否尝试第三步「公开发布」。true=全自动（可能需要前端动态签名 x-zse-96，
  # 失败会如实 failed 且草稿仍在）；false=只自动建草稿+写正文，返回 drafted 供人工点发布。
  web_auto_publish: true
  # 知乎官方规范要求「用户确认预览后」才能发 confirmed:true。
  # 全自动模式下采用「仓库所有者一次性长期授权」：只有你显式把它改成 true 才会发。
  # 改成 true 即代表你已确认：默认发布参数 + 长期授权自动发布，不再逐篇人工预览。
  standing_consent: false
  # AI 参与生成的内容，官方规范建议声明 ai_creation；是否声明由你决定。
  # 可选值：''（不发送）/ ai_creation / spoiler / fictional_creation / contain_finance / medical_advice
  creation_statement: ''
  comment_permission: all
  table_of_contents_enabled: false

juejin:
  category_id: '6809637771511070734'   # 开发工具
  tag_ids: ['7467857238494020000']     # AI编程
  brief_max: 100
  title_max: 80

csdn:
  tags: 'GitHub,开源,开发工具'
  read_type: public
  article_type: original
