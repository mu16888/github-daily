name: tech-track

# 赛道 A（AI 科技）云端自动化：掘金 / CSDN / 知乎。
#
# 与 daily.yml 的分工：
#   daily.yml      旧流水线，跑 src/main.py（默认 profile），保留作为回退
#   tech-track.yml 本流水线，跑 src/main.py --profile cloud（真发 + 赛道 A 三平台）
#
# 触发：每天北京时间 09:53 只唤醒一次（UTC 01:53，避开整点高峰）。
#       闸门用 once_daily 模式：当天台账没派发过就直接发，不再依赖
#       「每 15 分钟唤醒 + 算当天目标时刻」那套 —— GitHub 在高频 schedule
#       上会直接丢排队任务，2026-11-11 实测一整天 8 次唤醒全部没触发。
#       改 cron 的提交会让 GitHub 重新注册/激活这个 workflow 的 schedule。

on:
  schedule:
    - cron: '53 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只组装请求，不真发'
        type: boolean
        default: false
      force:
        description: '忽略时间闸门立即运行'
        type: boolean
        default: true

permissions:
  contents: write

# 与 daily.yml 同一个 concurrency 组：两个 workflow 不会同时跑，避免撞额度
concurrency:
  group: daily-github-picks
  cancel-in-progress: false

jobs:
  tech:
    runs-on: ubuntu-latest
    # 装 Chromium + 错峰等待，最长约 45 分钟
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 知乎浏览器通道需要 Playwright + Chromium（云端 Linux runner 没有 msedge）
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run pipeline (cloud profile)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 赛道 A 三平台凭据
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
          JUEJIN_UUID: ${{ secrets.JUEJIN_UUID }}
          CSDN_COOKIE: ${{ secrets.CSDN_COOKIE }}
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          # 知乎官方 OpenAPI（当前 auth_state=common_user 还没开放，先占位）
          ZHIHU_APP_KEY: ${{ secrets.ZHIHU_APP_KEY }}
          ZHIHU_APP_SECRET: ${{ secrets.ZHIHU_APP_SECRET }}
          PIPELINE_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SCHEDULE_FORCE: ${{ inputs.force && 'true' || 'false' }}
          # 单棒闸门：当天台账没派发过就直接发，不比对「当天目标时刻」
          SCHEDULE_MODE: once_daily
        run: |
          set -u
          FORCE_FLAG=""
          if [ "$SCHEDULE_FORCE" = "true" ]; then FORCE_FLAG="--force"; fi

          # 时间闸门：同一 shell 内读取结论，避免跨步骤 output 传递失败
          python -m src.schedule --check --align $FORCE_FLAG
          RUN=$(grep -E '^run=' "${GITHUB_OUTPUT:-/dev/null}" | tail -n1 | cut -d= -f2)
          if [ "$RUN" != "true" ]; then
            echo "[ci] 闸门未放行（run=$RUN），本棒空跑退出"
            exit 0
          fi

          # 单元冒烟（非阻断：B 赛道本地依赖测试在云端无意义失败，不影响 A 发布）
          python -m unittest discover -s tests 2>&1 | tail -3 || true

          DRY_FLAG=""
          if [ "$PIPELINE_DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; fi
          python -m src.main --profile cloud --dispatched $DRY_FLAG

      # 台账与成稿要提交回仓库：跨天去重依赖它，CI 不提交就会重复发同一篇
      - name: Commit drafts and state
        if: always()
        run: |
          mkdir -p drafts state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts state run-summary.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(tech-track): daily picks $(date -u +%F)"
            git push
          fi

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-track-summary-${{ github.run_id }}
          path: run-summary.json
          if-no-files-found: ignore
